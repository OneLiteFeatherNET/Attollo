name: Release

# release-please collects Conventional Commits into a release PR; merging it
# tags the version and cuts the GitHub release. Everything that has to happen
# for a release is chained into this same run on purpose: release-please tags
# with GITHUB_TOKEN, and a tag pushed that way does NOT start a separate
# `on: push: tags` workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: OneLiteFeatherNET/workflows/.github/workflows/release-please.yml@v2.8.1
    secrets: inherit

  publish:
    name: Publish to Hangar and Modrinth
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HANGAR_SECRET: ${{ secrets.HANGAR_KEY }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_KEY }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Same command semantic-release ran as its publishCmd, with the version
      # coming from release-please instead of from ${nextRelease.version}.
      - name: Build and publish
        run: ./gradlew -Pversion=${{ needs.release-please.outputs.version }} shadowJar publishAllPublicationsToHangar modrinth cyclonedxBom

      - name: Attach the plugin JAR to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" build/libs/Attollo-*.jar --clobber

      - name: Upload SBOM to Dependency-Track
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          serverhostname: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          projectname: "Attollo"
          projectversion: ${{ needs.release-please.outputs.version }}
          projecttags: 'bukkit,paper,plugin'
          bomfilename: "build/reports/cyclonedx/bom.xml"
          autocreate: true
          parent: 'becbe738-ef2b-4333-bd13-477ab794d76a'
  sbom:
    name: Attach SBOM to release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: bom.json
          # An SBOM is an inventory, not a finding list - never fail on it.
          exit-code: '0'

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" bom.json --clobber
